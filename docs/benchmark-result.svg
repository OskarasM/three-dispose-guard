<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Measured Three.js resource counts over 50 mount cycles</title>
  <desc id="desc">The unmanaged run rises from 9 to 401 resources. The guarded run remains at 1.</desc>
  <rect width="1200" height="500" fill="#0b0d0c"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="64" y="60" fill="#f3f5ee" font-size="22" font-weight="700">50-cycle WebGL allocation check</text>
    <text x="64" y="88" fill="#9da69e" font-size="13">renderer.info.memory geometries + textures</text>
    <g stroke="#252a26" stroke-width="1">
      <line x1="90" y1="130" x2="1130" y2="130"/>
      <line x1="90" y1="205" x2="1130" y2="205"/>
      <line x1="90" y1="280" x2="1130" y2="280"/>
      <line x1="90" y1="355" x2="1130" y2="355"/>
      <line x1="90" y1="430" x2="1130" y2="430"/>
    </g>
    <g fill="#68716b" font-size="11">
      <text x="45" y="134">400</text>
      <text x="45" y="209">300</text>
      <text x="45" y="284">200</text>
      <text x="45" y="359">100</text>
      <text x="68" y="434">0</text>
      <text x="88" y="462">1</text>
      <text x="1105" y="462">50 cycles</text>
    </g>
    <path d="M90 423 L1130 129" fill="none" stroke="#ff6545" stroke-width="5" stroke-linecap="round"/>
    <path d="M90 429 L1130 429" fill="none" stroke="#d8ff53" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1130" cy="129" r="7" fill="#ff6545"/>
    <circle cx="1130" cy="429" r="7" fill="#d8ff53"/>
    <g font-size="13" font-weight="700">
      <rect x="902" y="110" width="190" height="34" fill="#171a17"/>
      <text x="918" y="132" fill="#ff8b72">UNMANAGED 401</text>
      <rect x="902" y="386" width="190" height="34" fill="#171a17"/>
      <text x="918" y="408" fill="#d8ff53">DISPOSE GUARD 1</text>
    </g>
  </g>
</svg>
