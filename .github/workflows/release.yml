name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.repository == 'OskarasM/three-dispose-guard'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm CLI with trusted-publishing support
        run: npm install --global npm@latest
      - run: npm ci
      - name: Verify the tag matches package.json
        run: node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v' + p.version) throw new Error('Tag and package version differ')"
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run release:check
      # No NODE_AUTH_TOKEN. Authentication is npm trusted publishing over OIDC, using the
      # short-lived token that `id-token: write` lets GitHub mint for this workflow. Setting
      # a token here would take precedence and quietly put a long-lived credential back in
      # the loop.
      #
      # npm is told to trust organisation OskarasM, repository three-dispose-guard, workflow
      # file release.yml, environment npm. All four have to keep matching this file, and the
      # environment on the job above is part of that match.
      - name: Publish with npm provenance
        run: npm publish --provenance --access public
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --verify-tag --generate-notes --title "three-dispose-guard ${{ github.ref_name }}"
